{{ partial "header.html" . }}

<div class="content">
  {{ partial "sitenav.html" . }}
  {{ .Content }}

  <div class="post-list">
    {{ $blogSection := .Site.GetPage "section" "blog" }} {{ range $blogSection.Pages }}
    <div class="post-row">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="date">{{ .Date.Format "Jan 2, 2006" }}</span>
    </div>
    {{ end }}
  </div>
</div>
{{ partial "footer.html" . }}
